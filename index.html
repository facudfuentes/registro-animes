<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Animes en la Nube</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i data-lucide="film" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Mis Animes Vistos</h1>
                    <p class="text-xs text-slate-400">Base de datos compartida en la nube</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="role-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                    Modo Espectador
                </span>
                <button id="auth-btn" onclick="toggleAuthModal()" class="px-3.5 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition flex items-center gap-2 shadow-sm">
                    <i data-lucide="lock" class="w-4 h-4"></i> Acceso Admin
                </button>
                <button id="change-pwd-btn" onclick="openPasswordModal()" class="hidden px-3.5 py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex items-center gap-2 border border-slate-700">
                    <i data-lucide="key" class="w-4 h-4"></i> Clave
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- Panel de Estadísticas (Contadores) -->
        <div id="stats-bar" class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col">
                <span class="text-xs text-slate-400 font-medium">Total</span>
                <span id="stat-total" class="text-xl font-bold text-slate-100 mt-1">0</span>
            </div>
            <div class="bg-slate-900 border border-emerald-500/20 rounded-xl p-3.5 flex flex-col">
                <span class="text-xs text-emerald-400 font-medium">Excelente</span>
                <span id="stat-excelente" class="text-xl font-bold text-emerald-400 mt-1">0</span>
            </div>
            <div class="bg-slate-900 border border-sky-500/20 rounded-xl p-3.5 flex flex-col">
                <span class="text-xs text-sky-400 font-medium">Muy bueno</span>
                <span id="stat-muy-bueno" class="text-xl font-bold text-sky-400 mt-1">0</span>
            </div>
            <div class="bg-slate-900 border border-amber-500/20 rounded-xl p-3.5 flex flex-col">
                <span class="text-xs text-amber-400 font-medium">Bueno</span>
                <span id="stat-bueno" class="text-xl font-bold text-amber-400 mt-1">0</span>
            </div>
            <div class="bg-slate-900 border border-rose-500/20 rounded-xl p-3.5 flex flex-col col-span-2 sm:col-span-1">
                <span class="text-xs text-rose-400 font-medium">Malo</span>
                <span id="stat-malo" class="text-xl font-bold text-rose-400 mt-1">0</span>
            </div>
        </div>

        <!-- Admin Panel (Oculto por defecto) -->
        <div id="admin-panel" class="hidden mb-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="form-title" class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i> Agregar Nuevo Anime
                </h2>
                <button id="cancel-edit-btn" onclick="resetForm()" class="hidden text-xs text-slate-400 hover:text-white underline">Cancelar edición</button>
            </div>
            
            <form id="anime-form" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                <input type="hidden" id="anime-id">
                <div class="sm:col-span-7">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nombre del Anime</label>
                    <input type="text" id="anime-name" required placeholder="Ej. Shingeki no Kyojin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Puntaje</label>
                    <select id="anime-score" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                        <option value="Malo">Malo</option>
                        <option value="Bueno">Bueno</option>
                        <option value="Muy bueno">Muy bueno</option>
                        <option value="Excelente">Excelente</option>
                    </select>
                </div>
                <div class="sm:col-span-2 flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-md">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar
                    </button>
                </div>
            </form>
        </div>

        <!-- Filtros, Buscador y Orden -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
                    <input type="text" id="search-input" oninput="renderAnimes()" placeholder="Buscar anime..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                </div>
                <!-- Botón de Ordenamiento -->
                <button onclick="toggleSortOrder()" id="sort-btn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5 whitespace-nowrap" title="Cambiar ordenamiento">
                    <i data-lucide="arrow-up-down" class="w-4 h-4 text-indigo-400"></i> <span id="sort-label">Alfabético</span>
                </button>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                <button onclick="filterByScore('Todos')" id="filter-Todos" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 text-white transition whitespace-nowrap">Todos</button>
                <button onclick="filterByScore('Excelente')" id="filter-Excelente" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition whitespace-nowrap">Excelente</button>
                <button onclick="filterByScore('Muy bueno')" id="filter-Muy bueno" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition whitespace-nowrap">Muy bueno</button>
                <button onclick="filterByScore('Bueno')" id="filter-Bueno" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition whitespace-nowrap">Bueno</button>
                <button onclick="filterByScore('Malo')" id="filter-Malo" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition whitespace-nowrap">Malo</button>
            </div>
        </div>

        <!-- Listado -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center text-xs text-slate-400 font-medium">
                <span>ANIME</span>
                <span>PUNTAJE / ACCIONES</span>
            </div>
            <div id="animes-list" class="divide-y divide-slate-800/60">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </main>

    <!-- Modal Login Admin -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-base font-semibold mb-3 flex items-center gap-2">
                <i data-lucide="shield-check" class="w-5 h-5 text-indigo-400"></i> Autenticación de Administrador
            </h3>
            <p class="text-xs text-slate-400 mb-4">Ingresa la clave para habilitar la edición de registros.</p>
            <input type="password" id="admin-password-input" onkeydown="if(event.key==='Enter') verifyAdmin()" placeholder="Contraseña" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 mb-4 text-slate-100">
            <div class="flex justify-end gap-2">
                <button onclick="toggleAuthModal()" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white">Cancelar</button>
                <button onclick="verifyAdmin()" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- Modal Cambio de Contraseña -->
    <div id="pwd-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-base font-semibold mb-3 flex items-center gap-2">
                <i data-lucide="key-round" class="w-5 h-5 text-indigo-400"></i> Cambiar Contraseña Admin
